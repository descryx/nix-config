# --- Fonts & Text ---
font_family      cascadiacode
font_size        11.0
adjust_line_height -1

# --- Cursor & Shell ---
cursor_shape     block
shell_integration no-cursor

# --- Window Decoration & Behavior ---
hide_window_decorations yes
confirm_os_window_close 0

# --- Transparency ---
background_opacity 0.7

# --- Theme & Colors ---
background #020202
foreground #d1cfcf

# Black
color0  #0a0a0a
color8  #444444

# Red
color1  #ff0000
color9  #ff0000

# Green
color2  #00cc66
color10 #00ff88

# Yellow
color3  #ffcc00
color11 #ffe066

# Blue
color4  #ff66cc
color12 #ff99dd

# Magenta
color5  #ff66cc
color13 #ff99dd

# Cyan
color6  #cfbdbd
color14 #d4bcbc

# White
color7  #f5f5f5
color15 #ffffff

include themes/noctalia.conf
