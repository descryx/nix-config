# Replaces config/niri/scripts/obsidian-scratchpad.sh for Umbriel.
#
# The niri script stays in the niri module. Umbriel has native scratchpads, so
# this needs no niri IPC and no opacity trick: Mod+Y hides/shows the pad, and
# an empty pad launches Obsidian on the vault.

[[scratchpad]]
name = "obsidian"
spawn_when_empty = "obsidian \"$HOME/vaults/obsidian\""
hide_when_empty = true

# SoundCloud as a Chrome app. The pad is tiled so the all-Chrome
# default_scrolling_extent = 1.0 rule applies; the spawn_when_empty launch
# token places the new window in the pad.
[[scratchpad]]
name = "music"
spawn_when_empty = "google-chrome --app=https://soundcloud.com"
hide_when_empty = true
# Scratchpads default to stacking (floating). Tile this one so the Chrome
# window rule's default_scrolling_extent = 1.0 can make it full width.
layout.mode = "scrolling"
layout.scrolling.default_extent_fraction = 1.0
