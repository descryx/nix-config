# niri layout.kdl.

[layout]
gap = 1
# niri preset-column-widths, same five proportions.
extent_presets = [ 0.25, 0.33333, 0.5, 0.66667, 0.75 ]
# niri's own maximize button / maximize-column behavior.
client_maximize = "column"

[layout.scrolling]
# niri's unconditional window rule set every window to proportion 0.5, which
# overrides layout.kdl's default-column-width 1.0.
default_extent_fraction = 0.5
# niri: center-focused-column "never". Umbriel would otherwise center a strip
# narrower than the viewport, which niri does not do here.
center_focused = "never"
center_underfull_strip = false

[layout.tabs]
# niri: default-column-display "normal".
default_display = "normal"
