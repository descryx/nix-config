# niri keybinds.kdl.
#
# Defining [keybinds] replaces Umbriel's built-in bind set, so every bind that
# should remain active is listed here. niri-only actions without an Umbriel
# equivalent are omitted (zoom, app-id filtered recent windows, centering all
# visible columns).

[keybinds]

# --- Applications and session ------------------------------------------------

"Mod+F1" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+B" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Alt+B" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Ctrl+B" = { action = "spawn noctalia msg bar-toggle", repeat = false }
"Mod+Shift+F" = { action = "spawn luciole", repeat = false }
"Mod+Shift+B" = { action = "spawn zen", repeat = false }
"Mod+F3" = { action = "spawn noctalia msg desktop-widgets-toggle", repeat = false }
"Mod+Tab" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Shift+D" = { action = "spawn noctalia msg plugin alok-debnath/shelf:service all toggle", repeat = false }

"Mod+X" = { action = "spawn noctalia msg panel-toggle alexander/screen-toolkit:panel", repeat = false }
"Mod+Shift+X" = { action = "spawn noctalia msg panel-toggle alexander/screen-toolkit:result", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Q" = { action = "spawn wayscriber --daemon-toggle", repeat = false }
"Mod+F2" = { action = "spawn ghostty --font-size=3 --fullscreen=true --command=\"ghostty +boo\"", repeat = false }

"Mod+Ctrl+Space" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Alt+Space" = { action = "spawn noctalia msg panel-toggle noctalia/wallhaven:browser", repeat = false }
"Mod+Shift+Space" = { action = "spawn noctalia msg panel-toggle noctalia/mpvpaper:picker", repeat = false }

"Mod+Y" = { action = "scratchpad-toggle obsidian", repeat = false }
"Mod+Ctrl+Alt+H" = { action = "spawn google-chrome --app=https://animelib.org", repeat = false }
"Mod+M" = { action = "scratchpad-toggle music", repeat = false }

# niri recent-windows had Alt+Tab; Noctalia's switcher is the Umbriel equivalent.
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
"Alt+Shift+Tab" = { action = "spawn noctalia msg window-switcher hold reverse", repeat = false }

# --- Windows and columns -----------------------------------------------------

"Mod+W" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Alt+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+P" = { action = "overview-toggle", repeat = false }
"Mod+O" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+O" = { action = "window-focus-switch-floating", repeat = false }
"Mod+T" = { action = "column-toggle-tabbed", repeat = false }

# --- Focus and movement ------------------------------------------------------

"Mod+Ctrl+K" = "window-focus-up"
"Mod+Ctrl+J" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "workspace-previous"
"Mod+J" = "workspace-next"

"Mod+Left" = "output-focus-left"
"Mod+Right" = "output-focus-right"
"Mod+Shift+Left" = "column-move-to-output-left"
"Mod+Shift+Right" = "column-move-to-output-right"

"Mod+Shift+H" = "column-move-left"
"Mod+Shift+I" = "window-move-down"
"Mod+Shift+U" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+K" = "column-move-to-workspace-previous"
"Mod+Shift+J" = "column-move-to-workspace-next"

"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
# niri splits consume and expel on two keys. Umbriel has no expel-only action,
# so these keep the consume side and expelling stays on the bracket binds.
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"

# --- Resize ------------------------------------------------------------------

"Mod+Alt+H" = "window-modify-primary-extent -0.05"
"Mod+Alt+L" = "window-modify-primary-extent +0.05"
"Mod+Alt+K" = "window-modify-secondary-extent -0.05"
"Mod+Alt+J" = "window-modify-secondary-extent +0.05"
"Mod+R" = "window-cycle-primary-extent"

# --- Workspaces --------------------------------------------------------------

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+0" = "workspace-switch 10"

"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"
"Mod+Shift+0" = "column-move-to-workspace 10"

"Mod+Ctrl+Alt+K" = "workspace-move-up"
"Mod+Ctrl+Alt+J" = "workspace-move-down"

# --- Screenshots -------------------------------------------------------------

"Mod+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }

# --- Media and brightness ----------------------------------------------------
# Kept as niri's direct wpctl/brightnessctl commands. Routing these through
# `noctalia msg` instead would add Noctalia's OSDs and change the behavior.

"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }

"XF86MonBrightnessUp" = { action = "spawn brightnessctl set 5%+", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl set 5%-", allow_when_locked = true }

# --- Misc --------------------------------------------------------------------

"Mod+C" = "column-center"
"Mod+Backspace" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Up" = { action = "keyboard-layout-next", repeat = false }
