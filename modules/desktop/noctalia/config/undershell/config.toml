# undershell: desktop widgets under any shell (looks ported from Ryoku).
# Edit this file and save: changes apply live.
# Toggle the on-screen editor (drag to move, bottom-right corner to resize,
# right-click to finish) with:   undershell msg edit

[general]
grid = 16                 # snap step for the editor, px
noise_reduction = 0.45    # analyser smoothing (Ryoku's cava used 45)
monstercat = false        # spread peaks to neighbours (cava's monstercat)
idle = "show"             # visualizers with nothing playing: show | hide | demo
language = "system"       # editor language: system (follows the locale) | en | es
profiles = true           # remember a widget layout for each wallpaper

[[widget]]
id = "visualizer"
type = "visualizer"
output = "DP-1"
x = 0
y = 832
width = 1920
height = 248
space = [1920, 1080]
style = "line"             # bars split dots segments wave ribbon curtain line frame radial orb spiral
pin = [205.0, 809.0, 512.0, -1.0, 691.0, -2.0, 386.0, 831.0]
pin_corners = false
bars = 128
fps = 144
thickness = 1.00
glow = 1.00
reflection = 0.00
shape = "rounded"
mirror = false
idle_wave = false
color_mode = "custom"
color = "#ffffff"
color2 = "error"
idle = "auto"
gain = 1.0
smoothing = 0.50
opacity = 0.65
rotation = 0
depth = false
layer = -10
depth_level = 0
tilt_x = 0.0
tilt_y = 0.0
skew = 0.0
grow = "up"
halo_form = "circle"
halo_inner = 1.40
halo_width = 0.00
halo_spread = 0.10
halo_bloom = 0.00
halo_aurora = 1.00
halo_pulse = 1.00
halo_breathe = 1.00
halo_hits = 1.00
halo_waves = true
vortex_mode = "inside"
vortex_reach = 2.0
vortex_arms = 1
vortex_twist = 8.0
vortex_turbulence = 1.00
vortex_speed = 1.00
vortex_clockwise = false
vortex_ring = 1.00
