[widget.Crashes]
enabled = false
glyph = "mood-crazy-happy"
tooltip = "RMB to refresh"
type = "custom_button"

    [widget.Crashes.actions]
    left = "exec noctalia msg panel-toggle umedbazarov/crashes:panel"
    right = "exec noctalia msg plugin umedbazarov/crashes:service all refresh"

[widget.active_window]
icon_size = 18
max_length = 140
min_length = 1
title_scroll = "none"

[widget.activity]
type = "alexmnrs/github-activity:activity"

[widget.audio_visualizer]
bands = 64
centered = false
color_1 = "secondary"
color_2 = "secondary"
mirrored = false
reversed = true
width = 160

[widget.bar]
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.bar_10]
enabled = false
type = "eternalself-2328/undershell:bar"

[widget.bar_2]
show_resolution = false
type = "raycursive/niri-displays:bar"

[widget.bar_3]
type = "rylos/syncthing:bar"

[widget.bar_4]
type = "ahmedhossamdev/sticky-notes:bar"

[widget.bar_5]
type = "ahmedhossamdev/reading-list:bar"

[widget.bar_6]
type = "rylos/syncthing:bar"

[widget.bar_7]
show_mouse_events = false
type = "baizhu/input-echo-bar:bar"

[widget.bar_8]
type = "baizhu/paged-todo:bar"

[widget.bar_9]
type = "zumik3-del/opencode-go-usage:bar"

[widget.clock]
anchor = true
tooltip_format = "[{:%d-%m-%y / %H:%M:%S}]"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.cpu]
visualization = "graph"

[widget.github]
type = "shangshui0302/github-kanban:github"

[widget.media]
artist_first = false
enabled = false
hide_when_no_media = true
rotate_album_art = true
show_progress = true

[widget.media_2]
audio_spectrum = false
audio_spectrum_bands = 128
background_darkening = 60
background_expand_width = 220
background_width = 220
corner_rounding = 100
type = "pulser/hover-widgets:media"
visualiser_color = "secondary"

[widget.mirror]
enabled = false
type = "elijaharch/wl-screen-mirror:mirror"

[widget.mirror_2]
enabled = false
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network]
enabled = true
show_label = false

[widget.network_rx]
enabled = true
visualization = "graph"

[widget.network_tx]
capsule_fill = "primary"
enabled = true
visualization = "graph"

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.notifications]
